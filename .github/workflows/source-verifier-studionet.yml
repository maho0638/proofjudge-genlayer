name: SourceVerifier Studionet

on:
  push:
    paths:
      - ".github/workflows/source-verifier-studionet.yml"
  workflow_dispatch:

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Deploy and verify SourceVerifier on Studionet
        run: gltest tests/integration/test_source_verifier_studionet.py -v -s --network studionet
