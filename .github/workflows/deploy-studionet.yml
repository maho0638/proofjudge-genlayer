name: Deploy & Verify Studionet

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-studionet.yml"
      - "contracts/proof_judge.py"
      - "tests/integration/test_studionet_smoke.py"
  workflow_dispatch:

jobs:
  full-live-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r requirements.txt
      - run: npm install
      - name: Deploy and execute full ProofJudge escrow lifecycle
        id: live
        shell: bash
        run: |
          set -o pipefail
          gltest tests/integration/test_studionet_smoke.py -v -s --network studionet | tee /tmp/proofjudge-live.log
          ADDRESS="$(grep -oE 'PROOFJUDGE_CONTRACT_ADDRESS=0x[a-fA-F0-9]{40}' /tmp/proofjudge-live.log | tail -1 | cut -d= -f2)"
          test -n "$ADDRESS"
          echo "contract_address=$ADDRESS" >> "$GITHUB_OUTPUT"
      - name: Verify deployed source exactly matches repository contract
        env:
          CONTRACT_ADDRESS: ${{ steps.live.outputs.contract_address }}
        run: node scripts/verify-deployed-source.mjs
