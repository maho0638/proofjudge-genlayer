name: Deploy Studionet

on:
  push:
    paths:
      - ".github/workflows/deploy-studionet.yml"
  workflow_dispatch:

jobs:
  deploy-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Deploy ProofJudge and run live GenLayer smoke test
        run: gltest tests/integration/test_studionet_smoke.py -v -s --network studionet
