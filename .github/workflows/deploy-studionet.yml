name: Deploy & Verify Studionet

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-studionet.yml"
      - "contracts/proof_judge.py"
      - "tests/integration/test_studionet_smoke.py"
  workflow_dispatch:

jobs:
  full-live-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Deploy and execute full ProofJudge escrow lifecycle
        shell: bash
        run: |
          set -o pipefail
          gltest tests/integration/test_studionet_smoke.py -v -s --network studionet | tee /tmp/proofjudge-live.log
          grep -q 'PROOFJUDGE_DEPLOY_INPUT_MATCH=true' /tmp/proofjudge-live.log
          grep -Eq 'PROOFJUDGE_DEPLOY_SOURCE_SHA256=[a-f0-9]{64}' /tmp/proofjudge-live.log
          grep -Eq 'PROOFJUDGE_CONTRACT_ADDRESS=0x[a-fA-F0-9]{40}' /tmp/proofjudge-live.log
          grep -q 'PROOFJUDGE_PAID_REWARD_CLAIMED=true' /tmp/proofjudge-live.log
          grep -q 'PROOFJUDGE_REFUNDED=true' /tmp/proofjudge-live.log
